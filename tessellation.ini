; ============================================================================
; 皮肤细分 + 服装深度偏移 (皮肤PS 3f36f4a9b69e89bd / 服装PS 6f619bc773470686)
;
; 皮肤 draw: handling=skip 跳过原绘制, 然后
;   1. 备份 ib/vb0 -> CTO 触发 CC 框架替换: 游戏原始管线画部件 (未细分)
;   2. 标记节 (匹配 CC 替换的触发 draw) 置门控标记 = 1
;   3. 门控命中: 恢复备份的原始绑定, 在细分管线内重跑 vb0/ib 的 CTO
;      -> CC 替换逻辑再次执行, 这次所有部件带 HS/DS 绘制 (细分版)
;   4. from_caller 重放 (此时绑定=最后一块部件, 与第 3 步的该部件
;      副本重合, 无害); 无 CC 替换的 draw (头/口腔) 绑定未被改动,
;      重放自身即正确
;
; 服装 draw: 不细分 (细分后部件接缝处破洞明显), 改为提升深度偏移解决
; 布料与皮肤贴合处的 z-fighting 破洞: skip 后在 CustomShader 沙箱内
; 合并 depth_bias 再 from_caller 重画, CC 替换 (CTO) 同样在沙箱内触发,
; 使替换部件与重放副本都带偏移。详见服装节注释。
; ============================================================================

[Constants]
global $tess_body_draw = 0

; 备份用资源声明 (空节即可)。"Xxx = ref yy" 备份语句里的自定义资源必须
; 先以 [ResourceXxx] 空节声明: 解析时按 "去掉 Resource 前缀后的剩余名字"
; 查找声明节, 查不到则整行报 "Unrecognised entry" 并被跳过。此前使用的
; resourcebak_tess_ib 等名字与声明节名对不上, 正是日志里该警告的根源。
[ResourceTessBakIB]
[ResourceTessBakVB]

; ---------- 身体标记：只对 CC 身体替换的触发 draw 生效 ----------
[TextureOverrideTessBodyMark]
hash = 5ebf5088
match_first_index = 0
match_priority = 5
$tess_body_draw = 1

; ============================================================================
; 皮肤细分管线
; ============================================================================
[ShaderOverrideTessellation]
hash = 3f36f4a9b69e89bd
; 皮肤 PS hash 同时被 d3dx.ini 的 Skin_TEDDY01 节和 WetEffects 的 -Skin
; 节使用。overrule 表示本节单方面接受同 hash 共存, 用于压制 "Possible
; Mod Conflict: Duplicate ShaderOverride" 警告 (true 为合作模式, 要求
; 所有同 hash 的节都声明才静默; 第三方文件改不到, 故用 overrule)。
allow_duplicate_hash = overrule
;partner = ba2ad61fa36ff709
handling = skip
$shader_type = 2

; 服装 Mod + 帧分析 dump（复用 CommandListSkin 的逻辑）
dump = deferred_ctx_accurate share_dupes ps-t0 mono dds
dump = deferred_ctx_accurate share_dupes ps-t1 mono dds
dump = deferred_ctx_accurate share_dupes ps-t2 mono dds
; Dump tan texture:
dump = deferred_ctx_accurate share_dupes ps-t3 mono dds
; Dump mesh:
analyse_options = deferred_ctx_accurate share_dupes dump_vb txt buf
; Dump skinning matrices:
dump = deferred_ctx_accurate vs-cb2 txt buf

ResourceTessBakIB = ref ib
ResourceTessBakVB = ref vb0

$tess_body_draw = 0
if $costume_mods && (!frame_analysis || $dump_modded_meshes)
	; 让 CostumeCustomizer 等 mod 的网格/纹理替换在本 draw 上生效
	checktextureoverride = ps-t0
	checktextureoverride = ps-t1
	checktextureoverride = ps-t2
	checktextureoverride = ps-t3
	checktextureoverride = vb0
	checktextureoverride = ib
endif

	if $tess_body_draw == 1
	; 恢复原始身体绑定, 让 CTO 能在细分管线内再次命中替换逻辑
	ib = ref ResourceTessBakIB
	vb0 = ref ResourceTessBakVB
	run = CustomShaderTessParts
	$tess_body_draw = 0
	endif
run = CustomShaderTessellation

[CustomShaderTessellation]
topology = 3_control_point_patch_list
vs = ba2ad61fa36ff709-vs_replace.txt
hs = simple_tess_skin.hs.txt
ds = simple_tess_skin.ds.txt
ps = 3f36f4a9b69e89bd-ps_replace.txt
draw = from_caller
rasterizer_state_merge = 1
blend_state_merge = 1
slope_scaled_depth_bias = 0
depth_bias = 20
x = 0.85
y = 4.0

; 在细分管线内重跑身体替换: ib/vb0 已恢复为游戏原始身体网格,
; CTO 再次命中 [TextureOverrideBody], 由 CC 框架自己完成部件选择
; (chest/groin/breast 回退、Slot 1/2) 并绘制 -> 全部件细分重画
[CustomShaderTessParts]
topology = 3_control_point_patch_list
vs = ba2ad61fa36ff709-vs_replace.txt
hs = simple_tess_skin.hs.txt
ds = simple_tess_skin.ds.txt
ps = 3f36f4a9b69e89bd-ps_replace.txt
rasterizer_state_merge = 1
blend_state_merge = 1
slope_scaled_depth_bias = 0
depth_bias = 20
checktextureoverride = vb0
checktextureoverride = ib

; ============================================================================
; 服装: 不细分, 仅提升深度偏移, 解决布料与皮肤贴合处的破洞 (z-fighting)
;
; 皮肤细分后 DS 插值使皮肤与衣服表面在贴合处的深度出现微小差异,
; 两者 depth_bias 相同(+2)时深度比较结果随视角抖动, 表现为衣服上
; 随机破洞。衣服不再细分后, 用足够大的常量偏移让服装稳定赢下深度
; 比较。bias 只影响深度比较, 不改顶点位置; 斜率项保持 0 (slope 随
; 表面倾角变化, 会破坏不同朝向表面间的相对深度)。
; 调节: 破洞仍在 -> 同时调大下面两节的 depth_bias (10-100); 远处或
; 身体后面的布料翻到皮肤前面 -> 相应调小。两节数值必须保持一致。
; ============================================================================
[ShaderOverrideTessellationClothes]
hash = 6f619bc773470686
; d3dx.ini 的 ShaderOverrideClothes_TEDDY01_20220524 与本节同 hash 且未
; 声明 allow_duplicate_hash。true 是合作模式 (所有同 hash 的节都要声明
; 才静默), 第三方文件改不到, 故用 overrule 单方面声明即可压制警告。
allow_duplicate_hash = overrule
; CustomShader 是沙箱 (合并状态 -> 执行自身命令列表 -> 恢复), 所以必须
; handling=skip 跳过原始 draw, 在沙箱内用 from_caller 带偏移重画; CC
; 服装替换 (CTO) 也挪进沙箱触发, 让替换部件同样带偏移。
handling = skip
$shader_type = 1

if $costume_mods && (!frame_analysis || $dump_modded_meshes)
	run = CustomShaderTessClothesBiasCTO
else
	run = CustomShaderTessClothesBias
endif

; 带 CC 替换重画: 沙箱内先触发服装替换 (部件带偏移绘制), 再 from_caller
; 重放本 draw 自身兜底 (CC 场景下绑定=最后一块部件, 与该部件副本重合,
; 无害; 无替换场景下即原样重放)
[CustomShaderTessClothesBiasCTO]
rasterizer_state_merge = 1
depth_bias = 50
slope_scaled_depth_bias = 0
checktextureoverride = ps-t0
checktextureoverride = ps-t1
checktextureoverride = ps-t2
checktextureoverride = vb0
checktextureoverride = ib
draw = from_caller

; 仅重画 (帧分析/无 CC 替换场景): 合并偏移后原样重放本 draw
[CustomShaderTessClothesBias]
rasterizer_state_merge = 1
depth_bias = 50
slope_scaled_depth_bias = 0
draw = from_caller